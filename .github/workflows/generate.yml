name: generate

on:
  push:
    branches-ignore:
      - production
  pull_request:
    branches-ignore:
      - production
  workflow_dispatch:

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: [redacted]
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Generate SDK
        run: |
          bun ./packages/sdk/js/script/build.ts
          (cd packages/opencode && bun dev generate > ../sdk/openapi.json)
          bun x prettier --write packages/sdk/openapi.json

      - name: Format
        run: ./script/format.ts
        env:
          CI: true
          PUSH_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
